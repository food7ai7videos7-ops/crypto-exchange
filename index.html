<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Exchange Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0b0e11; color: #fff; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: #181a20; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h2 { color: #f0b90b; text-align: center; }
        .section { margin-bottom: 20px; padding: 15px; background: #2b313a; border-radius: 5px; }
        input, select { width: 100%; padding: 8px; margin: 5px 0 10px 0; background: #181a20; border: 1px solid #474d57; color: #fff; border-radius: 4px; }
        button { width: 100%; padding: 10px; background: #f0b90b; border: none; font-weight: bold; color: #000; border-radius: 4px; cursor: pointer; }
        button:hover { background: #d9a406; }
        pre { background: #0b0e11; padding: 10px; border-radius: 4px; overflow-x: auto; color: #0ecb81; }
    </style>
</head>
<body>

<div class="container">
    <h2>Crypto Exchange Panel</h2>

    <!-- 1. Register Section -->
    <div class="section">
        <h3>1. Register User</h3>
        <input type="text" id="regUsername" placeholder="Username">
        <input type="email" id="regEmail" placeholder="Email">
        <input type="password" id="regPassword" placeholder="Password">
        <button onclick="registerUser()">Register</button>
    </div>

    <!-- 2. Deposit Section -->
    <div class="section">
        <h3>2. Deposit USDT</h3>
        <input type="text" id="depUserId" placeholder="User ID">
        <input type="number" id="depAmount" placeholder="Amount (USDT)">
        <button onclick="depositUSDT()">Deposit</button>
    </div>

    <!-- 3. Open Trade Section -->
    <div class="section">
        <h3>3. Open Trade</h3>
        <input type="text" id="tradeUserId" placeholder="User ID">
        <input type="text" id="tradeSymbol" placeholder="Symbol (e.g., BTCUSDT)" value="BTCUSDT">
        <select id="tradeType">
            <option value="BUY">BUY</option>
            <option value="SELL">SELL</option>
        </select>
        <input type="number" id="tradeAmount" placeholder="Investment Amount">
        <input type="number" id="tradeEntry" placeholder="Entry Price">
        <input type="number" id="tradeFee" placeholder="Platform Fee" value="1">
        <input type="number" id="tradeTarget" placeholder="Target (Take Profit)">
        <input type="number" id="tradeSL" placeholder="Stop Loss">
        <button onclick="openTrade()">Open Trade</button>
    </div>

    <!-- 4. Close Trade Section -->
    <div class="section">
        <h3>4. Close Trade</h3>
        <input type="text" id="closeTradeId" placeholder="Trade ID">
        <input type="number" id="closeExitPrice" placeholder="Exit Price">
        <button onclick="closeTrade()">Close Trade</button>
    </div>

    <!-- Response Box -->
    <div class="section">
        <h3>Server Response:</h3>
        <pre id="responseBox">Action output will appear here...</pre>
    </div>
</div>

<script>
    // Yahan apna Vercel backend ka URL likhein (e.g., https://your-app.vercel.app)
    const BACKEND_URL = "https://crypto-exchange-blush.vercel.app"; 

    async function registerUser() {
        const username = document.getElementById('regUsername').value;
        const email = document.getElementById('regEmail').value;
        const password = document.getElementById('regPassword').value;

        const res = await fetch(`${BACKEND_URL}/api/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, email, password })
        });
        const data = await res.json();
        document.getElementById('responseBox').innerText = JSON.stringify(data, null, 2);
        if(data.user) {
            document.getElementById('depUserId').value = data.user._id;
            document.getElementById('tradeUserId').value = data.user._id;
        }
    }

    async function depositUSDT() {
        const userId = document.getElementById('depUserId').value;
        const amount = document.getElementById('depAmount').value;

        const res = await fetch(`${BACKEND_URL}/api/deposit`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId, amount })
        });
        const data = await res.json();
        document.getElementById('responseBox').innerText = JSON.stringify(data, null, 2);
    }

    async function openTrade() {
        const userId = document.getElementById('tradeUserId').value;
        const symbol = document.getElementById('tradeSymbol').value;
        const type = document.getElementById('tradeType').value;
        const amount = document.getElementById('tradeAmount').value;
        const entryPrice = document.getElementById('tradeEntry').value;
        const platformFee = document.getElementById('tradeFee').value;
        const target = document.getElementById('tradeTarget').value;
        const stopLoss = document.getElementById('tradeSL').value;

        const res = await fetch(`${BACKEND_URL}/api/trade/open`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId, symbol, type, amount, entryPrice, platformFee, target, stopLoss })
        });
        const data = await res.json();
        document.getElementById('responseBox').innerText = JSON.stringify(data, null, 2);
        if(data.trade) {
            document.getElementById('closeTradeId').value = data.trade._id;
        }
    }

    async function closeTrade() {
        const tradeId = document.getElementById('closeTradeId').value;
        const exitPrice = document.getElementById('closeExitPrice').value;

        const res = await fetch(`${BACKEND_URL}/api/trade/close`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ tradeId, exitPrice })
        });
        const data = await res.json();
        document.getElementById('responseBox').innerText = JSON.stringify(data, null, 2);
    }
</script>

</body>
</html>
